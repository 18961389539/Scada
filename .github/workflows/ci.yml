name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast:
    name: 后端构建与测试（核心/网关/采集）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 还原
        run: dotnet restore Scada.sln
      - name: 覆盖率基线棘轮
        # 门禁只校验「不低于基线」，顺手把基线改低就能让 CI 静默变绿（Collector 曾 77.09 → 64.14）。
        # 这里对比本次改动的 base 提交：任何下降都必须在 tools/coverage/coverage-drops.json 写明原因。
        shell: pwsh
        env:
          SCADA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCADA_BEFORE_SHA: ${{ github.event.before }}
          SCADA_EVENT: ${{ github.event_name }}
        run: |
          $ref = if ($env:SCADA_EVENT -eq 'pull_request') { $env:SCADA_BASE_SHA } else { $env:SCADA_BEFORE_SHA }
          if (-not $ref -or $ref -match '^0{40}$') { Write-Host '没有可比较的 base 提交，跳过棘轮检查'; exit 0 }
          git fetch --no-tags --depth=1 origin $ref
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags --depth=1 origin main
            if ($LASTEXITCODE -ne 0) { Write-Error "无法获取 base 提交 $ref，棘轮检查无法完成"; exit 1 }
          }
          node tools/coverage/coverage-gate.mjs --check-ratchet --base-ref FETCH_HEAD
      - name: 构建
        run: dotnet build Scada.sln -c Release --no-restore --nologo
      - name: EF 模型漂移检查
        # 改了实体却忘记 dotnet ef migrations add 时，构建与单测都可能是绿的，
        # 直到现场升级才在 DatabaseInitializer 里炸。这里对比实体模型与 ModelSnapshot，
        # 有差异直接失败。两个 DbContext 都要查——它们各自有独立的迁移链。
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          foreach ($context in @("ConfigDbContext", "RuntimeDbContext")) {
            dotnet ef migrations has-pending-model-changes --project src/Scada.Data --startup-project src/Scada.Data --context $context -c Release --no-build
            if ($LASTEXITCODE -ne 0) {
              Write-Error "模型已变更但缺少迁移（$context）：请运行 dotnet ef migrations add <Name> --context $context"
              exit $LASTEXITCODE
            }
          }
      - name: 配置文档一致性
        # 配置项清单由 ScadaSettings.cs 生成；改了配置却忘记重新生成，文档就会与代码脱节。
        run: python tools/config-doc/generate.py --check
      - name: 迁移链体检
        # 迁移条数与 Designer/Snapshot 行数只增不减。超过 80 条时提醒安排基线折叠；
        # 这里只读，不改现场库（squash 操作与风险见 docs/quality/migration-baseline.md）。
        run: python tools/migration-baseline/analyze.py --warn 80
      - name: 依赖漏洞门禁（NuGet）
        # dotnet list 在有漏洞时的退出码不稳定，故只认 JSON 内容。
        # 未登记的漏洞直接失败；白名单条目必须有原因，漏洞消失后也要删除条目。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          dotnet list Scada.sln package --vulnerable --include-transitive --format json > TestResults/nuget-vuln.json
          node tools/security/check-nuget-vulnerabilities.mjs --file TestResults/nuget-vuln.json
      - name: 安装覆盖率采集器
        run: dotnet tool install --global dotnet-coverage
      - name: 测试与覆盖率采集
        # 用 dotnet-coverage 做进程级采集：coverlet 在依赖被测试宿主提前加载时会锁模块，
        # 在 Server/Collector 项目上会整份报告失败。各项目分别采集，退出码原样传播。
        # 分片口径：核心/网关/采集走本作业，服务端/引擎走 backend-server；覆盖率由 coverage 作业合并后再比基线。
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $env:DOTNET_COVERAGE_NOLOGO = "1"
          # 与 Scada.sln 中的测试项目严格一致：--no-build 要求每个项目都有编译产物，
          # 未在 sln 里的项目（例如尚在开发中的独立测试工程）不能出现在这份清单里。
          foreach ($project in @("Scada.Core.Tests", "Scada.Collector.Tests", "Scada.Gateway.Tests", "Scada.Data.Tests", "Scada.Desktop.Tests", "Scada.Protocols.Tests")) {
            $out = "TestResults/$project/coverage.cobertura.xml"
            # --blame-hang：单条用例超过 5 分钟视为挂起，产出手写序列后失败，而不是让作业静默卡到超时。
            dotnet-coverage collect -f cobertura -o $out "dotnet test tests/$project -c Release --no-build --nologo --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory TestResults/$project"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 网关发布包与部署预演
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'scada-gateway-package'
          ./tools/deployment/Build-GatewayPackage.ps1 -OutputPath $package -Runtime win-x64
          ./tools/deployment/Test-GatewayDeployment.ps1 -ProgramPath $package
          ./tools/deployment/Test-GatewayUpgrade.ps1 -ProgramPath $package
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-fast
          path: TestResults
          if-no-files-found: ignore

  backend-server:
    name: 后端构建与测试（服务端/引擎）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 还原
        run: dotnet restore Scada.sln
      - name: 构建
        run: dotnet build Scada.sln -c Release --no-restore --nologo
      - name: 安装覆盖率采集器
        run: dotnet tool install --global dotnet-coverage
      - name: 测试与覆盖率采集
        # Server 全量约 11 分钟、Engine 约 3 分钟；与 backend-fast 并行执行，反馈时间不再叠加。
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $env:DOTNET_COVERAGE_NOLOGO = "1"
          foreach ($project in @("Scada.Server.Tests", "Scada.Engine.Tests")) {
            $out = "TestResults/$project/coverage.cobertura.xml"
            # 10 分钟对应「单条用例」而非整轮；Server 上偶发无输出的 MCP/HA 用例就是靠它变成可诊断的失败。
            dotnet-coverage collect -f cobertura -o $out "dotnet test tests/$project -c Release --no-build --nologo --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none --results-directory TestResults/$project"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-server
          path: TestResults
          if-no-files-found: ignore

  coverage:
    name: 覆盖率汇总门禁
    needs: [backend-fast, backend-server]
    # 任一分片失败时不评覆盖率，避免把「测试没跑完」误读成「覆盖率下降」。
    if: needs.backend-fast.result == 'success' && needs.backend-server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载分片覆盖率
        uses: actions/download-artifact@v4
        with:
          pattern: dotnet-coverage-*
          merge-multiple: true
          path: TestResults
      - name: 覆盖率汇总与基线比对
        # 基线文件在 tools/coverage/coverage-baseline.json；任一程序集低于基线即失败。
        run: node tools/coverage/coverage-gate.mjs --dir TestResults

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 依赖漏洞门禁（生产依赖）
        # 只守会进发布包的生产依赖；开发依赖的漏洞随工具链升级处理，不阻塞发布。
        # 有 high 及以上未修复时失败；确需保留的漏洞必须修到 0，不设白名单。
        run: npm audit --omit=dev --audit-level=high
      - name: 类型检查与构建
        run: npm run build
      - name: 静态规则（ESLint）
        run: npm run lint
      - name: 国际化与权限一致性
        run: npm run i18n:check && npm run check:access && npm run check:hygiene && npm run test:unit

  smoke:
    name: 核心流程门禁
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:build
      - name: 独立数据核心流程重复验证
        run: npm run test:smoke -- --repeat-each=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-smoke-results
          path: web/test-results
          if-no-files-found: ignore

  package:
    name: 服务端绿色包
    needs: [backend-fast, backend-server, frontend, smoke]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 发布自包含包
        run: dotnet publish src/Scada.Server/Scada.Server.csproj -c Release -r win-x64 --self-contained true -o out --nologo
      - name: 校验发布结构
        shell: pwsh
        run: |
          foreach ($required in @('out/Scada.Server.exe', 'out/appsettings.json', 'out/wwwroot/index.html')) {
            if (-not (Test-Path $required)) { throw "发布包缺少 $required" }
          }
      - name: 发布包运行、备份恢复和重启验证
        run: |
          dotnet build tools/Scada.BackupTool/Scada.BackupTool.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/deployment/test-server-package.mjs --package out
      - name: 写入发布元数据及文件校验值
        run: node tools/deployment/package-manifest.mjs out
      - name: 压缩
        shell: pwsh
        run: |
          $zip = "scada-server-win-x64-${{ github.run_number }}.zip"
          Compress-Archive -Path out/* -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" | Set-Content "$zip.sha256"
          Write-Host "包大小 $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: scada-server-win-x64-${{ github.run_number }}
          path: |
            scada-server-win-x64-*.zip
            scada-server-win-x64-*.zip.sha256
          retention-days: 30

  desktop-package:
    name: 桌面客户端包
    needs: [backend-fast, backend-server]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建桌面客户端包
        shell: pwsh
        run: ./tools/deployment/desktop/Build-DesktopPackage.ps1 -OutputPath "${{ runner.temp }}/scada-desktop" -Version "${{ github.run_number }}"
      - name: 验证安装、升级、回滚、卸载
        shell: pwsh
        run: ./tools/deployment/desktop/Test-DesktopDeployment.ps1 -PackagePath "${{ runner.temp }}/scada-desktop" -Version "${{ github.run_number }}"
      - name: 上传桌面客户端包
        uses: actions/upload-artifact@v4
        with:
          name: scada-desktop-win-x64-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/scada-desktop.zip
            ${{ runner.temp }}/scada-desktop.zip.sha256
          retention-days: 30

  e2e:
    name: 端到端（阻断）
    runs-on: windows-latest
    # 端口与数据目录已按 worker 隔离，全量场景纳入阻断；核心冒烟仍由 smoke 作业先行把关。
    timeout-minutes: 90
    env:
      PW_CHANNEL: chromium
      PW_WORKERS: 4
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 安装浏览器
        run: npx playwright install chromium
      - name: 构建端到端产物
        run: npm run test:e2e:build
      - name: 校验前端契约类型
        run: npm run api:types:check
      - name: 运行接口与浏览器场景
        run: npx playwright test --grep-invert "core:|@smoke"
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore

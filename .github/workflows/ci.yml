name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 还原
        run: dotnet restore Scada.sln
      - name: 构建
        run: dotnet build Scada.sln -c Release --no-restore --nologo
      - name: 安装覆盖率采集器
        run: dotnet tool install --global dotnet-coverage
      - name: 测试与覆盖率采集
        # 用 dotnet-coverage 做进程级采集：coverlet 在依赖被测试宿主提前加载时会锁模块，
        # 在 Server/Collector 项目上会整份报告失败。四个项目分别采集，退出码原样传播。
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $env:DOTNET_COVERAGE_NOLOGO = "1"
          foreach ($project in @("Scada.Server.Tests", "Scada.Engine.Tests", "Scada.Collector.Tests", "Scada.Gateway.Tests")) {
            $out = "TestResults/$project/coverage.cobertura.xml"
            dotnet-coverage collect -f cobertura -o $out "dotnet test tests/$project -c Release --no-build --nologo --results-directory TestResults/$project"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 覆盖率汇总与基线比对
        # 基线文件在 tools/coverage/coverage-baseline.json；任一程序集低于基线即失败。
        run: node tools/coverage/coverage-gate.mjs --dir TestResults
      - name: 网关发布包与部署预演
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'scada-gateway-package'
          ./tools/deployment/Build-GatewayPackage.ps1 -OutputPath $package -Runtime win-x64
          ./tools/deployment/Test-GatewayDeployment.ps1 -ProgramPath $package
          ./tools/deployment/Test-GatewayUpgrade.ps1 -ProgramPath $package
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查与构建
        run: npm run build
      - name: 静态规则（ESLint）
        run: npm run lint
      - name: 国际化与权限一致性
        run: npm run i18n:check && npm run check:access && npm run check:hygiene && npm run test:unit

  smoke:
    name: 核心流程门禁
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:build
      - name: 独立数据核心流程重复验证
        run: npm run test:smoke -- --repeat-each=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-smoke-results
          path: web/test-results
          if-no-files-found: ignore

  package:
    name: 服务端绿色包
    needs: [backend, frontend, smoke]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 发布自包含包
        run: dotnet publish src/Scada.Server/Scada.Server.csproj -c Release -r win-x64 --self-contained true -o out --nologo
      - name: 校验发布结构
        shell: pwsh
        run: |
          foreach ($required in @('out/Scada.Server.exe', 'out/appsettings.json', 'out/wwwroot/index.html')) {
            if (-not (Test-Path $required)) { throw "发布包缺少 $required" }
          }
      - name: 发布包运行、备份恢复和重启验证
        run: |
          dotnet build tools/Scada.BackupTool/Scada.BackupTool.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/deployment/test-server-package.mjs --package out
      - name: 写入发布元数据及文件校验值
        run: node tools/deployment/package-manifest.mjs out
      - name: 压缩
        shell: pwsh
        run: |
          $zip = "scada-server-win-x64-${{ github.run_number }}.zip"
          Compress-Archive -Path out/* -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" | Set-Content "$zip.sha256"
          Write-Host "包大小 $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: scada-server-win-x64-${{ github.run_number }}
          path: |
            scada-server-win-x64-*.zip
            scada-server-win-x64-*.zip.sha256
          retention-days: 30

  e2e:
    name: 端到端（阻断）
    runs-on: windows-latest
    # 端口与数据目录已按 worker 隔离，全量场景纳入阻断；核心冒烟仍由 smoke 作业先行把关。
    timeout-minutes: 90
    env:
      PW_CHANNEL: chromium
      PW_WORKERS: 4
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 安装浏览器
        run: npx playwright install chromium
      - name: 构建端到端产物
        run: npm run test:e2e:build
      - name: 校验前端契约类型
        run: npm run api:types:check
      - name: 运行接口与浏览器场景
        run: npx playwright test --grep-invert "core:|@smoke"
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
